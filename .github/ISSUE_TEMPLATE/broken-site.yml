# SPDX-License-Identifier: GPL-3.0-or-later
name: Broken site / سایت خراب
description: CPAB breaks a page or hides something that is not an ad. / تبلیغ‌شکن صفحه‌ای را خراب می‌کند یا چیزی را پنهان می‌کند که تبلیغ نیست.
title: "Broken site: "
labels: [broken-site]
body:
  - type: markdown
    attributes:
      value: |
        This report is public. Write the site's name, not the full address of a private page.

        این گزارش عمومی است. نام سایت را بنویسید، نه نشانی کامل یک صفحهٔ خصوصی را.
  - type: input
    id: site
    attributes:
      label: Site / سایت
      description: The site's name only, such as example.com. / فقط نام سایت، مثل example.com.
      placeholder: example.com
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What is broken? / چه چیزی خراب شده؟
      description: What goes wrong and where on the page. Does pausing CPAB on this site fix it? You can write in English or Persian. / چه چیزی و کجای صفحه درست کار نمی‌کند؟ آیا با توقف تبلیغ‌شکن در این سایت درست می‌شود؟ می‌توانید انگلیسی یا فارسی بنویسید.
    validations:
      required: true
  - type: input
    id: cpab
    attributes:
      label: CPAB and browser version / نسخهٔ تبلیغ‌شکن و مرورگر
      placeholder: CPAB 0.3.6, Chrome 157
  - type: textarea
    id: lists
    attributes:
      label: Lists / فهرست‌ها
      description: Filled in by CPAB's Report this site button. / دکمهٔ گزارش این سایت در تبلیغ‌شکن این بخش را پر می‌کند.
